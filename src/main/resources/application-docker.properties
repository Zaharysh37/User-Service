server.port=${APP_PORT:8081}

spring.datasource.username=${D_DB_USER}
spring.datasource.password=${D_DB_PASSWORD}

spring.datasource.url=jdbc:postgresql://postgres-user-db:${D_DB_HOST_PORT}/${D_DB_NAME}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://authservice-app:${AUTH_APP_PORT}/api/auth/.well-known/jwks.json

management.metrics.tags.application=${spring.application.name}
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=http://tempo:4318/v1/traces
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]